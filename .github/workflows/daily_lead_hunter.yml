name: Daily Amazon Private Label Lead Hunter

on:
  schedule:
    # Runs automatically once every day at 08:00 AM UTC (adjust to any hour)
    - cron: '0 8 * * *'
  # Allows triggering manually anytime from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      pages:
        description: 'Pages to crawl per keyword'
        required: false
        default: '2'
      persona:
        description: 'Filter by brand persona (leave blank for all): NEW_LAUNCH | STAGNANT_VETERAN | DISTRESSED'
        required: false
        default: ''
      require_contactable:
        description: 'Skip leads with zero contact info? (true/false)'
        required: false
        default: 'true'
      direct_only:
        description: 'Require a direct/personal founder contact (not CS email)? (true/false)'
        required: false
        default: 'false'
      refresh_keywords:
        description: 'Force-regenerate keywords from Amazon BSR/Movers/DDGS, bypassing cache? (true/false)'
        required: false
        default: 'false'

jobs:
  hunt-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build CLI flags
        id: flags
        run: |
          FLAGS="--pages ${{ github.event.inputs.pages || 2 }}"

          # Contactability gate: default ON for automated runs (only skip if explicitly false)
          REQUIRE_CONTACTABLE="${{ github.event.inputs.require_contactable || 'true' }}"
          if [ "$REQUIRE_CONTACTABLE" = "false" ]; then
            FLAGS="$FLAGS --allow-uncontactable"
          fi

          # Direct-contact-only gate: default OFF
          DIRECT_ONLY="${{ github.event.inputs.direct_only || 'false' }}"
          if [ "$DIRECT_ONLY" = "true" ]; then
            FLAGS="$FLAGS --direct-only"
          fi

          # Persona filter: only add if provided
          PERSONA="${{ github.event.inputs.persona || '' }}"
          if [ -n "$PERSONA" ]; then
            FLAGS="$FLAGS --persona $PERSONA"
          fi

          # Keyword refresh: default OFF (uses daily cache for speed; Monday auto-refreshes)
          REFRESH_KW="${{ github.event.inputs.refresh_keywords || 'false' }}"
          # Auto-refresh keywords every Monday (day-of-week 1 in cron = Monday)
          DOW=$(date +%u)
          if [ "$REFRESH_KW" = "true" ] || [ "$DOW" = "1" ]; then
            FLAGS="$FLAGS --refresh-keywords"
          fi

          echo "flags=$FLAGS" >> $GITHUB_OUTPUT
          echo "Resolved flags: $FLAGS"

      - name: Run Lead Discovery & Send Email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python auto_hunter.py ${{ steps.flags.outputs.flags }}

      - name: Persist Historical Deduplication Database
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lead-hunter-data
          path: data/
          retention-days: 90
