name: Daily Amazon Private Label Lead Hunter

on:
  schedule:
    # Runs automatically once every day at 08:00 AM UTC (adjust to any hour)
    - cron: '0 8 * * *'
  # Allows triggering manually anytime from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      pages:
        description: 'Pages to crawl per keyword'
        required: false
        default: '2'

jobs:
  hunt-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Lead Discovery & Send Email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python auto_hunter.py --pages ${{ github.event.inputs.pages || 2 }}

      - name: Persist Historical Deduplication Database
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lead-hunter-data
          path: data/
          retention-days: 90
